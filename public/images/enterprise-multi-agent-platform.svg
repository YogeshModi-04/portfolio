<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222222" stroke-width="0.75" />
      <circle cx="0" cy="0" r="1" fill="#444444" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FFFFFF" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#777777" />
    </marker>
    
    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <linearGradient id="glow-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="#0A0A0A" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Outer HUD Frame -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#333333" stroke-width="1.5" />
  <circle cx="20" cy="20" r="3" fill="#FFFFFF" />
  <circle cx="1180" cy="20" r="3" fill="#FFFFFF" />
  <circle cx="20" cy="780" r="3" fill="#FFFFFF" />
  <circle cx="1180" cy="780" r="3" fill="#FFFFFF" />

  <!-- HEADER / TITLE -->
  <g transform="translate(45, 60)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" fill="#777777" letter-spacing="3" font-weight="700">ARCHITECTURE OVERVIEW // SYSTEM SCHEMATIC</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="url(#header-grad)" font-weight="800" letter-spacing="0.5">ENTERPRISE MULTI-AGENT AI PLATFORM</text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" fill="#888888">Protocol: A2A (Agent-to-Agent) • Engine: LangGraph + Gemini • Vector KB: Qdrant</text>
  </g>

  <!-- STATS BADGES (TOP RIGHT) -->
  <g transform="translate(860, 50)">
    <!-- 46+ Systems -->
    <rect x="0" y="0" width="140" height="50" rx="4" fill="#141414" stroke="#333333" stroke-width="1.5" />
    <text x="70" y="24" text-anchor="middle" font-family="monospace" font-size="18" fill="#FFFFFF" font-weight="800">46+</text>
    <text x="70" y="40" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888888" letter-spacing="1">DATA SILOS</text>

    <!-- 10k Specs -->
    <rect x="150" y="0" width="130" height="50" rx="4" fill="#141414" stroke="#333333" stroke-width="1.5" />
    <text x="215" y="24" text-anchor="middle" font-family="monospace" font-size="18" fill="#FFFFFF" font-weight="800">10,000+</text>
    <text x="215" y="40" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888888" letter-spacing="1">PRODUCT SPECS</text>
  </g>

  <!-- CONNECTOR PIPELINES (Background Paths) -->
  <!-- User Query into Router -->
  <path d="M 175 250 L 235 250" fill="none" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Router to Agent Mesh Spine -->
  <path d="M 375 250 L 430 250" fill="none" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Agent Dispatch Spine -->
  <path d="M 445 190 L 445 430" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Bus into Individual Agents -->
  <path d="M 445 190 L 485 190" fill="none" stroke="#FFFFFF" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 445 250 L 485 250" fill="none" stroke="#FFFFFF" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 445 310 L 485 310" fill="none" stroke="#FFFFFF" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 445 370 L 485 370" fill="none" stroke="#FFFFFF" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 445 430 L 485 430" fill="none" stroke="#FFFFFF" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Agents into Async Distributed Fabric -->
  <path d="M 685 310 L 740 310" fill="none" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Fabric to Qdrant/RAG -->
  <path d="M 940 310 L 995 310" fill="none" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- COLUMN 1: USER / ACCESS (Problem & Interface) -->
  <g transform="translate(45, 160)">
    <rect x="0" y="0" width="130" height="320" rx="6" fill="url(#glow-card)" stroke="#333333" stroke-width="1" />
    <text x="65" y="28" text-anchor="middle" font-family="monospace" font-size="10" fill="#777777" letter-spacing="1">ACCESS TIER</text>
    
    <!-- User Node -->
    <rect x="15" y="55" width="100" height="65" rx="4" fill="#111111" stroke="#555555" stroke-width="1" />
    <circle cx="65" cy="80" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 52 105 A 13 13 0 0 1 78 105" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="65" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CCCCCC">Plain Query</text>

    <!-- No-Code Agent Builder -->
    <rect x="15" y="145" width="100" height="70" rx="4" fill="#111111" stroke="#444444" stroke-dasharray="2 2" />
    <text x="65" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">No-Code</text>
    <text x="65" y="187" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888888">Studio</text>
    <text x="65" y="203" text-anchor="middle" font-family="monospace" font-size="8" fill="#555555">USER CONFIG</text>

    <!-- RBAC Gate -->
    <rect x="15" y="240" width="100" height="60" rx="4" fill="#111111" stroke="#555555" stroke-width="1" />
    <text x="65" y="265" text-anchor="middle" font-family="monospace" font-size="10" fill="#FFFFFF" font-weight="700">RBAC</text>
    <text x="65" y="282" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888888">Access Gate</text>
  </g>

  <!-- COLUMN 2: ORCHESTRATION / ROUTER -->
  <g transform="translate(235, 160)">
    <rect x="0" y="0" width="140" height="320" rx="6" fill="url(#glow-card)" stroke="#555555" stroke-width="1.5" />
    <text x="70" y="28" text-anchor="middle" font-family="monospace" font-size="10" fill="#888888" letter-spacing="1">ORCHESTRATION</text>

    <!-- Core Routing Node -->
    <rect x="15" y="55" width="110" height="110" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="70" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="800">LangGraph</text>
    <text x="70" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#CCCCCC">+ Gemini</text>
    <line x1="30" y1="115" x2="110" y2="115" stroke="#333333" stroke-width="1" />
    <text x="70" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="#888888">DYNAMIC</text>
    <text x="70" y="145" text-anchor="middle" font-family="monospace" font-size="8" fill="#888888">INTENT ROUTER</text>

    <!-- A2A Protocol Box -->
    <rect x="15" y="195" width="110" height="105" rx="4" fill="#141414" stroke="#333333" stroke-width="1" />
    <text x="70" y="222" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF" font-weight="700">A2A BUS</text>
    <text x="70" y="238" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#777777">Agent-to-Agent</text>
    <path d="M 35 265 L 105 265 M 45 258 L 35 265 L 45 272 M 95 258 L 105 265 L 95 272" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="70" y="286" text-anchor="middle" font-family="monospace" font-size="7" fill="#555555">CONCURRENT</text>
  </g>

  <!-- COLUMN 3: MULTI-AGENT POOL (5+ SPECIALIZED AGENTS) -->
  <g transform="translate(485, 155)">
    <rect x="-10" y="5" width="210" height="320" rx="6" fill="#0E0E0E" stroke="#262626" stroke-width="1" />
    <text x="95" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#777777" letter-spacing="1">SPECIALIZED WORKERS</text>

    <!-- Agent 1 -->
    <rect x="5" y="40" width="180" height="42" rx="3" fill="#141414" stroke="#444444" stroke-width="1" />
    <text x="20" y="65" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Analytics Agent</text>
    <text x="170" y="65" text-anchor="end" font-family="monospace" font-size="9" fill="#777777">#01</text>

    <!-- Agent 2 -->
    <rect x="5" y="95" width="180" height="42" rx="3" fill="#141414" stroke="#444444" stroke-width="1" />
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Catalog &amp; Specs Agent</text>
    <text x="170" y="120" text-anchor="end" font-family="monospace" font-size="9" fill="#777777">#02</text>

    <!-- Agent 3 -->
    <rect x="5" y="150" width="180" height="42" rx="3" fill="#141414" stroke="#444444" stroke-width="1" />
    <text x="20" y="175" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Documentation Agent</text>
    <text x="170" y="175" text-anchor="end" font-family="monospace" font-size="9" fill="#777777">#03</text>

    <!-- Agent 4 -->
    <rect x="5" y="205" width="180" height="42" rx="3" fill="#141414" stroke="#444444" stroke-width="1" />
    <text x="20" y="230" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Vendor Intel Agent</text>
    <text x="170" y="230" text-anchor="end" font-family="monospace" font-size="9" fill="#777777">#04</text>

    <!-- Agent 5 -->
    <rect x="5" y="260" width="180" height="42" rx="3" fill="#141414" stroke="#444444" stroke-width="1" />
    <text x="20" y="285" font-family="sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Compliance &amp; Audit</text>
    <text x="170" y="285" text-anchor="end" font-family="monospace" font-size="9" fill="#777777">#05</text>
  </g>

  <!-- COLUMN 4: DISTRIBUTED ASYNC BACKEND & GOVERNANCE -->
  <g transform="translate(740, 160)">
    <rect x="0" y="0" width="200" height="320" rx="6" fill="url(#glow-card)" stroke="#333333" stroke-width="1" />
    <text x="100" y="28" text-anchor="middle" font-family="monospace" font-size="10" fill="#777777" letter-spacing="1">ASYNC BACKEND</text>

    <!-- Distributed Runtime Core -->
    <rect x="15" y="55" width="170" height="80" rx="4" fill="#111111" stroke="#555555" stroke-width="1" />
    <text x="100" y="83" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">Distributed Async</text>
    <text x="100" y="99" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CCCCCC">Execution Engine</text>
    <text x="100" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#888888">NON-BLOCKING QUEUE</text>

    <!-- Admin-Gated Tracing -->
    <rect x="15" y="150" width="170" height="65" rx="4" fill="#141414" stroke="#444444" stroke-width="1" />
    <text x="100" y="175" text-anchor="middle" font-family="monospace" font-size="10" fill="#FFFFFF" font-weight="700">ADMIN-GATED TRACING</text>
    <text x="100" y="193" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888888">Cost Cap &amp; Sensitivity Filters</text>

    <!-- Governance / Observability -->
    <rect x="15" y="230" width="170" height="70" rx="4" fill="#111111" stroke="#333333" stroke-width="1" />
    <text x="100" y="257" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#DDDDDD" font-weight="600">Audit Trails &amp; Metrics</text>
    <text x="100" y="274" text-anchor="middle" font-family="monospace" font-size="8" fill="#666666">REAL-TIME MONITORING</text>
  </g>

  <!-- COLUMN 5: DATA LAYER & VECTOR STORAGE -->
  <g transform="translate(995, 160)">
    <rect x="0" y="0" width="160" height="320" rx="6" fill="url(#glow-card)" stroke="#555555" stroke-width="1.5" />
    <text x="80" y="28" text-anchor="middle" font-family="monospace" font-size="10" fill="#888888" letter-spacing="1">KNOWLEDGE BASE</text>

    <!-- Qdrant Core -->
    <rect x="15" y="55" width="130" height="90" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="80" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF" font-weight="800">Qdrant</text>
    <text x="80" y="103" text-anchor="middle" font-family="monospace" font-size="9" fill="#AAAAAA">VECTOR ENGINE</text>
    <text x="80" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#777777">RAG Pipelines</text>

    <!-- Data Sources Bucket -->
    <rect x="15" y="165" width="130" height="135" rx="4" fill="#111111" stroke="#333333" stroke-width="1" />
    <text x="80" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="#888888">INDEXED SOURCES</text>
    
    <g transform="translate(25, 202)" font-family="sans-serif" font-size="9" fill="#CCCCCC">
      <text x="0" y="0">• Sales Analytics</text>
      <text x="0" y="18">• Product Catalog</text>
      <text x="0" y="36">• Vendor Records</text>
      <text x="0" y="54">• Internal Specs</text>
      <text x="0" y="72">• Tech Docs (46+)</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: IMPACT & DEPLOYMENT HIGHLIGHTS -->
  <g transform="translate(45, 530)">
    <rect x="0" y="0" width="1110" height="210" rx="6" fill="#0F0F0F" stroke="#333333" stroke-width="1.5" />
    
    <!-- Impact Panel Header -->
    <text x="25" y="35" font-family="monospace" font-size="11" fill="#777777" letter-spacing="2">KEY RESULTS // BUSINESS IMPACT</text>

    <!-- Metric Card 1 -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="320" height="120" rx="4" fill="#141414" stroke="#2B2B2B" stroke-width="1" />
      <text x="25" y="48" font-family="monospace" font-size="36" fill="#FFFFFF" font-weight="900">80%</text>
      <text x="120" y="38" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Deployment Reduction</text>
      <text x="120" y="54" font-family="sans-serif" font-size="10" fill="#888888">via Containerized Rollout</text>
      <line x1="25" y1="75" x2="295" y2="75" stroke="#252525" stroke-width="1" />
      <text x="25" y="98" font-family="sans-serif" font-size="9" fill="#777777">Turnaround slashed from weeks to hours.</text>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(395, 60)">
      <rect x="0" y="0" width="320" height="120" rx="4" fill="#141414" stroke="#2B2B2B" stroke-width="1" />
      <text x="25" y="48" font-family="monospace" font-size="32" fill="#FFFFFF" font-weight="900">0-CODE</text>
      <text x="155" y="38" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Self-Service Agents</text>
      <text x="155" y="54" font-family="sans-serif" font-size="10" fill="#888888">Non-Technical Staff Access</text>
      <line x1="25" y1="75" x2="295" y2="75" stroke="#252525" stroke-width="1" />
      <text x="25" y="98" font-family="sans-serif" font-size="9" fill="#777777">Custom agents spawned directly by staff.</text>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(760, 60)">
      <rect x="0" y="0" width="320" height="120" rx="4" fill="#141414" stroke="#2B2B2B" stroke-width="1" />
      <text x="25" y="48" font-family="monospace" font-size="36" fill="#FFFFFF" font-weight="900">100%</text>
      <text x="140" y="38" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Audit Traceability</text>
      <text x="140" y="54" font-family="sans-serif" font-size="10" fill="#888888">Role-Based Gated Logs</text>
      <line x1="25" y1="75" x2="295" y2="75" stroke="#252525" stroke-width="1" />
      <text x="25" y="98" font-family="sans-serif" font-size="9" fill="#777777">Full cost attribution &amp; sensitivity control.</text>
    </g>
  </g>
</svg>
