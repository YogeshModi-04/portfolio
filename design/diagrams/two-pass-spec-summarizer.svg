<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222222" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Tech Dot Matrix -->
    <pattern id="dotmatrix" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#333333" />
    </pattern>

    <!-- Linear Gradients for Monochromatic Depth -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers for Connectors -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#666666" />
    </marker>
  </defs>

  <style>
    .mono-title { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 800; }
    .mono-header { font-family: 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
    .mono-label { font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 0.5px; }
    .mono-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
    
    .pulse-line {
      stroke-dasharray: 6 6;
      animation: dash 1.5s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -12;
      }
    }

    /* Embedded as an image, so this file is its own document and the page's
       global reduced-motion rule cannot reach it. Honour the preference here. */
    @media (prefers-reduced-motion: reduce) {
      .pulse-line {
        animation: none;
      }
    }
  </style>

  <!-- Deep Solid Background -->
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  
  <!-- Subtle Blueprint / Precision Grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ==================== TOP SYSTEM TITLE BAR ==================== -->
  <g transform="translate(60, 48)">
    <circle cx="6" cy="6" r="6" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="6" cy="6" r="2.5" fill="#000000"/>
    <text x="24" y="11" fill="#ffffff" class="mono-header" font-size="12">Gemini Document Intelligence Architecture</text>
    <text x="24" y="38" fill="#ffffff" class="mono-title" font-size="28">TWO-PASS SPEC SUMMARIZER</text>
    <text x="490" y="36" fill="#777777" class="mono-body" font-size="12">Pipeline: High-Volume Civil Engineering Spec Extraction &amp; Synthesis</text>
    
    <!-- Status / Spec Badges -->
    <g transform="translate(850, 18)">
      <rect width="130" height="24" rx="12" fill="#141414" stroke="#333333" stroke-width="1.5"/>
      <circle cx="14" cy="12" r="3.5" fill="#ffffff"/>
      <text x="26" y="15.5" fill="#eeeeee" class="mono-label" font-size="10">PIPELINE: ACTIVE</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTOR PATHS (BG LAYER) ==================== -->
  <!-- Pass 1 Fan-in Connectors to Reducer -->
  <path d="M 640 180 C 685 180, 680 340, 725 340" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 640 340 L 725 340" fill="none" stroke="#ffffff" stroke-width="2" class="pulse-line"/>
  <path d="M 640 500 C 685 500, 680 340, 725 340" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Raw Input to Pass 1 Engines -->
  <path d="M 230 240 C 275 240, 275 180, 315 180" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M 230 340 L 315 340" fill="none" stroke="#ffffff" stroke-width="2" class="pulse-line" marker-end="url(#arrow)"/>
  <path d="M 230 440 C 275 440, 275 500, 315 500" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- ==================== COLUMN 1: RAW MULTI-SPEC INGESTION ==================== -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" fill="#666666" class="mono-label">STAGE 01</text>
    <text x="0" y="16" fill="#ffffff" class="mono-header" font-size="12">Raw Civil Specs</text>

    <!-- Container Card -->
    <g transform="translate(0, 30)">
      <rect width="180" height="420" rx="10" fill="url(#cardGrad)" stroke="#262626" stroke-width="1.5" filter="url(#shadow)"/>
      <rect width="180" height="420" rx="10" fill="url(#dotmatrix)" opacity="0.1"/>

      <!-- Stacked Spec Document 1: Structural Concrete -->
      <g transform="translate(18, 26)">
        <rect width="144" height="100" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
        <path d="M 30 20 L 70 20 M 30 32 L 125 32 M 30 44 L 110 44 M 30 56 L 95 56" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
        <rect x="30" y="74" width="70" height="12" rx="3" fill="#222222"/>
        <text x="35" y="83" fill="#888888" class="mono-label" font-size="8">DIV 03 : CONCRETE</text>
      </g>

      <!-- Stacked Spec Document 2: Geotech & Earthwork (Highlighted) -->
      <g transform="translate(18, 146)">
        <rect width="144" height="120" rx="6" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
        <path d="M 30 24 L 75 24 M 30 38 L 125 38 M 30 52 L 115 52 M 30 66 L 90 66" stroke="#aaaaaa" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="30" y="86" width="85" height="16" rx="3" fill="#ffffff"/>
        <text x="35" y="98" fill="#000000" class="mono-label" font-size="8" font-weight="700">DIV 31 : EARTHWORK</text>
      </g>

      <!-- Stacked Spec Document 3: MEP & Utilities -->
      <g transform="translate(18, 286)">
        <rect width="144" height="100" rx="6" fill="#141414" stroke="#444444" stroke-width="1"/>
        <path d="M 30 20 L 65 20 M 30 32 L 120 32 M 30 44 L 105 44 M 30 56 L 85 56" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
        <rect x="30" y="74" width="60" height="12" rx="3" fill="#222222"/>
        <text x="35" y="83" fill="#888888" class="mono-label" font-size="8">DIV 22 : PIPING</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2: PASS 1 (ISOLATED EXTRACTION) ==================== -->
  <g transform="translate(320, 120)">
    <text x="0" y="0" fill="#666666" class="mono-label">PASS 01 : DECONSTRUCT</text>
    <text x="0" y="16" fill="#ffffff" class="mono-header" font-size="12">Per-Doc Summarization</text>

    <!-- Node 1: Top Doc Extraction Engine -->
    <g transform="translate(0, 30)">
      <rect width="320" height="70" rx="8" fill="url(#cardGrad)" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="25" cy="35" r="10" fill="#1f1f1f" stroke="#555555"/>
      <path d="M 21 35 L 29 35 M 25 31 L 25 39" stroke="#ffffff" stroke-width="1.5"/>
      <text x="48" y="30" fill="#ffffff" font-size="12" font-weight="700">Gemini Spec-Extractor A</text>
      <text x="48" y="48" fill="#777777" class="mono-label" font-size="9">Outputs structural constraints &amp; tolerances</text>
      <line x1="260" y1="35" x2="305" y2="35" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    </g>

    <!-- Node 2: Center Primary Extraction Engine -->
    <g transform="translate(0, 170)">
      <rect width="320" height="100" rx="8" fill="#141414" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
      
      <!-- Tech Badge -->
      <rect x="225" y="10" width="80" height="18" rx="9" fill="#222222" stroke="#444444"/>
      <text x="238" y="22" fill="#dddddd" class="mono-label" font-size="8">GEMINI 1.5</text>

      <path d="M 28 32 L 34 20 L 40 32 L 52 38 L 40 44 L 34 56 L 28 44 L 16 38 Z" fill="url(#coreGlow)"/>
      
      <text x="64" y="38" fill="#ffffff" font-size="14" font-weight="800">Gemini Spec-Extractor B</text>
      <text x="64" y="58" fill="#999999" class="mono-body" font-size="11">Extracts compliance, soil tests &amp; backfill rules</text>

      <line x1="64" y1="75" x2="280" y2="75" stroke="#2a2a2a" stroke-width="1"/>
      <text x="64" y="88" fill="#666666" class="mono-label" font-size="9">PAYLOAD: Structured Intermediate JSON</text>
    </g>

    <!-- Node 3: Bottom Doc Extraction Engine -->
    <g transform="translate(0, 350)">
      <rect width="320" height="70" rx="8" fill="url(#cardGrad)" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="25" cy="35" r="10" fill="#1f1f1f" stroke="#555555"/>
      <path d="M 21 35 L 29 35 M 25 31 L 25 39" stroke="#ffffff" stroke-width="1.5"/>
      <text x="48" y="30" fill="#ffffff" font-size="12" font-weight="700">Gemini Spec-Extractor C</text>
      <text x="48" y="48" fill="#777777" class="mono-label" font-size="9">Outputs load tables &amp; material ratings</text>
      <line x1="260" y1="35" x2="305" y2="35" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    </g>
  </g>

  <!-- ==================== COLUMN 3: PASS 2 (SYNTHESIS ENGINE) ==================== -->
  <g transform="translate(730, 120)">
    <text x="0" y="0" fill="#666666" class="mono-label">PASS 02 : SYNTHESIZE</text>
    <text x="0" y="16" fill="#ffffff" class="mono-header" font-size="12">Roll-Up Core</text>

    <!-- Central Concentrator Diamond Box -->
    <g transform="translate(0, 140)">
      <rect width="100" height="160" rx="12" fill="#111111" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
      
      <!-- Diamond Core Graphic -->
      <g transform="translate(50, 65)">
        <polygon points="0,-28 28,0 0,28 -28,0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <polygon points="0,-16 16,0 0,16 -16,0" fill="#ffffff"/>
      </g>

      <text x="50" y="118" fill="#ffffff" class="mono-header" font-size="10" text-anchor="middle">ROLL-UP</text>
      <text x="50" y="132" fill="#777777" class="mono-label" font-size="8" text-anchor="middle">SYNTHESIZER</text>
      <text x="50" y="145" fill="#444444" class="mono-label" font-size="7" text-anchor="middle">Cross-Spec Audit</text>
    </g>
  </g>

  <!-- Connecting Out of Synthesis to Unified Output -->
  <path d="M 830 340 L 890 340" fill="none" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 4: UNIFIED CLIENT REVIEW ==================== -->
  <g transform="translate(890, 120)">
    <text x="0" y="0" fill="#666666" class="mono-label">FINAL ARTIFACT</text>
    <text x="0" y="16" fill="#ffffff" class="mono-header" font-size="12">Unified Summary</text>

    <g transform="translate(0, 30)">
      <!-- Master Sheet Drop Shadow Backdrop -->
      <rect width="150" height="420" rx="8" fill="#141414" stroke="#2d2d2d" stroke-width="1"/>
      <rect x="6" y="6" width="138" height="408" rx="6" fill="#ffffff" filter="url(#shadow)"/>

      <!-- Document Internal Graphics (High Contrast Dark on Light) -->
      <g transform="translate(18, 22)">
        <!-- Top Client Header Block -->
        <rect x="0" y="0" width="114" height="8" fill="#000000"/>
        <rect x="0" y="12" width="60" height="5" fill="#888888"/>
        
        <line x1="0" y1="28" x2="114" y2="28" stroke="#dddddd" stroke-width="1"/>

        <!-- Executive Summary Section -->
        <rect x="0" y="38" width="85" height="6" fill="#111111"/>
        <rect x="0" y="48" width="114" height="3" fill="#cccccc"/>
        <rect x="0" y="54" width="105" height="3" fill="#cccccc"/>
        <rect x="0" y="60" width="95" height="3" fill="#cccccc"/>

        <!-- Cross-Verification Matrix -->
        <rect x="0" y="78" width="114" height="42" rx="3" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="0.5"/>
        <path d="M 12 90 L 22 100 L 40 86" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="48" y="88" width="55" height="4" fill="#333333"/>
        <rect x="48" y="96" width="40" height="3" fill="#777777"/>
        <text x="8" y="114" fill="#555555" class="mono-label" font-size="6">CROSS-SPEC VERIFIED</text>

        <!-- Key Flags / Roll-up Metrics -->
        <rect x="0" y="132" width="114" height="50" rx="3" fill="#000000"/>
        <text x="10" y="148" fill="#ffffff" class="mono-label" font-size="7" font-weight="700">CRITICAL FINDINGS</text>
        <circle cx="14" cy="160" r="2" fill="#ffffff"/>
        <rect x="22" y="158" width="75" height="3" fill="#ffffff"/>
        <circle cx="14" cy="170" r="2" fill="#ffffff"/>
        <rect x="22" y="168" width="65" height="3" fill="#ffffff"/>

        <!-- Fast Client Sign-off Badge -->
        <g transform="translate(0, 310)">
          <rect width="114" height="40" rx="4" fill="#f8f8f8" stroke="#000000" stroke-width="1.5"/>
          <text x="12" y="18" fill="#000000" class="mono-header" font-size="8">FAST CLIENT REVIEW</text>
          <text x="12" y="30" fill="#555555" class="mono-label" font-size="7">APPROVED SUMMARY</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== BASE METRICS & TECH ACCENTS ==================== -->
  <g transform="translate(60, 610)">
    <line x1="0" y1="0" x2="980" y2="0" stroke="#222222" stroke-width="1"/>
    <text x="0" y="24" fill="#555555" class="mono-label">MODEL: GEMINI 1.5 PRO / FLASH</text>
    <text x="240" y="24" fill="#555555" class="mono-label">MAP-REDUCE SUMMARY PIPELINE</text>
    <text x="500" y="24" fill="#555555" class="mono-label">LATENCY REDUCTION: ~75%</text>
    <text x="760" y="24" fill="#555555" class="mono-label">DOMAIN: CIVIL INFRASTRUCTURE</text>
  </g>
</svg>
